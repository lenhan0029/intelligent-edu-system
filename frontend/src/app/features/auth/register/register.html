<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">SmartEdu</span>
      </div>
      <h2>Join Us</h2>
      <p>Create your account to start learning</p>
    </div>

    <form [formGroup]="registerForm" (submit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="icon">👤</span>
          <input type="text" id="username" formControlName="username" placeholder="Choose a username">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="icon">📧</span>
          <input type="email" id="email" formControlName="email" placeholder="your@email.com">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input type="password" id="password" formControlName="password" placeholder="••••••••">
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <span class="icon">🛡️</span>
          <input type="password" id="confirmPassword" formControlName="confirmPassword" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading" class="btn-primary">
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/login">Login here</a></p>
      </div>

      <div class="divider">
        <span>OR SIGN UP WITH</span>
      </div>

      <div class="social-login">
        <button type="button" (click)="registerWithGoogle()" class="btn-social google">
          <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">
        </button>
        <button type="button" class="btn-social github">
          <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="Github">
        </button>
      </div>
    </form>

    <div *ngIf="errorMessage" class="error-toast">
      {{ errorMessage }}
    </div>
  </div>
</div>
