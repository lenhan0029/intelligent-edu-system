<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900 py-12 px-4 sm:px-6 lg:px-8 font-sans">
  <div class="max-w-md w-full space-y-8 bg-white dark:bg-slate-800 p-10 rounded-2xl shadow-xl transition-all duration-300 hover:shadow-2xl">
    <div>
      <h2 class="mt-2 text-center text-3xl font-extrabold text-slate-900 dark:text-white">
        Đăng nhập
      </h2>
      <p class="mt-2 text-center text-sm text-slate-600 dark:text-slate-400">
        Chào mừng trở lại! Đăng nhập để tiếp tục.
      </p>
    </div>
    
    <div class="flex flex-col gap-4 mt-6">
      <button (click)="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg shadow-sm bg-white dark:bg-slate-700 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
        Tiếp tục với Google
      </button>
      <button (click)="loginWithGithub()" class="w-full flex items-center justify-center gap-3 px-4 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg shadow-sm bg-white dark:bg-slate-700 text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
        <img src="https://www.svgrepo.com/show/512317/github-142.svg" class="w-5 h-5" alt="GitHub">
        Tiếp tục với GitHub
      </button>
    </div>

    <div class="relative mt-8 mb-4">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-slate-300 dark:border-slate-600"></div>
      </div>
      <div class="relative flex justify-center text-sm">
        <span class="px-2 bg-white dark:bg-slate-800 text-slate-500">Hoặc tiếp tục với</span>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div *ngIf="errorMessage" class="bg-red-50 text-red-500 p-3 rounded text-sm mb-4">
        {{ errorMessage }}
      </div>

      <div class="space-y-2">
        <mat-form-field appearance="outline" class="w-full !mb-[-1.25em]">
          <mat-label>Tài khoản hoặc Email</mat-label>
          <input matInput formControlName="username" placeholder="Ví dụ: nva@gmail.com">
          <mat-icon matPrefix class="mr-2">person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full !mb-[-1.25em]">
          <mat-label>Mật khẩu</mat-label>
          <input matInput type="password" formControlName="password" placeholder="Nhập mật khẩu">
          <mat-icon matPrefix class="mr-2">lock</mat-icon>
        </mat-form-field>
      </div>

      <div class="flex items-center justify-between pt-4">
        <div class="flex items-center">
          <mat-checkbox color="primary" class="text-sm">Ghi nhớ đăng nhập</mat-checkbox>
        </div>

        <div class="text-sm">
          <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400">
            Quên mật khẩu?
          </a>
        </div>
      </div>

      <div class="pt-2">
        <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || isLoading" class="w-full py-6 text-lg rounded-xl shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">
          <span class="font-semibold tracking-wide">{{ isLoading ? 'ĐANG ĐĂNG NHẬP...' : 'ĐĂNG NHẬP' }}</span>
        </button>
      </div>
    </form>
    
    <p class="mt-6 text-center text-sm text-slate-600 dark:text-slate-400">
      Chưa có tài khoản? 
      <a routerLink="/register" class="font-bold text-indigo-600 hover:text-indigo-500 dark:text-indigo-400">Tạo tài khoản mới</a>
    </p>
  </div>
</div>
