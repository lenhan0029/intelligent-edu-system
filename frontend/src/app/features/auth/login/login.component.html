<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-header">
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">SmartEdu</span>
      </div>
      <h2>Welcome Back</h2>
      <p>Please enter your credentials to login</p>
    </div>

    <form (submit)="onSubmit($event)" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="icon">👤</span>
          <input type="text" id="username" [(ngModel)]="username" name="username" required placeholder="Enter your username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="icon">🔒</span>
          <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="••••••••">
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-password">Forgot password?</a>
      </div>

      <button type="submit" [disabled]="loading" class="btn-primary">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading" class="loader"></span>
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Register now</a></p>
      </div>

      <div class="divider">
        <span>OR</span>
      </div>

      <div class="social-login">
        <button type="button" (click)="loginWithGoogle()" class="btn-social google">
          <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">
        </button>
        <button type="button" (click)="loginWithGithub()" class="btn-social github">
          <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="Github">
        </button>
      </div>
    </form>

    <div *ngIf="error" class="error-toast">
      {{ error }}
    </div>
  </div>
</div>
