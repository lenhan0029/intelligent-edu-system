<div class="chat-container card" style="height: calc(100vh - 160px); padding:0; display:flex; overflow:hidden;">
  <!-- Sidebar -->
  <div class="chat-sidebar" style="width: 320px; border-right: 1px solid var(--border); display:flex; flex-direction:column;">
    <div style="padding: 1.5rem; border-bottom: 1px solid var(--border);">
      <h3 style="margin-bottom: 1rem;">Messages</h3>
      <div class="search-bar" style="max-width:none;">
        <i class="fas fa-search search-icon"></i>
        <input type="text" placeholder="Search chats...">
      </div>
    </div>
    
    <div class="conversation-list" style="flex:1; overflow-y:auto;">
      <div *ngFor="let chat of conversations" 
           class="chat-item" 
           [class.active]="chat.id === selectedChatId"
           (click)="selectChat(chat.id)"
           style="display:flex; gap: 1rem; padding: 1.25rem 1.5rem; cursor:pointer; transition:var(--transition); border-bottom: 1px solid #f8fafc;">
        <div class="avatar" style="flex-shrink:0;">
          <img [src]="'https://ui-avatars.com/api/?name=' + chat.name" alt="">
        </div>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 0.25rem;">
            <span style="font-weight:600; font-size:0.875rem;">{{ chat.name }}</span>
            <span style="font-size:0.75rem; color: var(--text-muted);">{{ chat.lastTime }}</span>
          </div>
          <p style="font-size:0.75rem; color: var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            {{ chat.lastMsg }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-main" style="flex:1; display:flex; flex-direction:column; background: #fff;">
    <!-- Chat Header -->
    <div *ngIf="selectedChat" style="padding: 1rem 2rem; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
       <div style="display:flex; align-items:center; gap: 1rem;">
          <div class="avatar" style="width:36px; height:36px;"><img [src]="'https://ui-avatars.com/api/?name=' + selectedChat.name" alt=""></div>
          <div>
             <div style="font-weight:600;">{{ selectedChat.name }}</div>
             <div style="font-size:0.75rem; color: var(--success);">Online</div>
          </div>
       </div>
       <div style="display:flex; gap: 1rem;">
          <button class="icon-btn" style="border:none;"><i class="fas fa-phone"></i></button>
          <button class="icon-btn" style="border:none;"><i class="fas fa-video"></i></button>
       </div>
    </div>

    <!-- Messages Area -->
    <div class="messages-area" style="flex:1; padding: 2rem; overflow-y:auto; display:flex; flex-direction:column; gap: 1rem; background: #fdfdfd;">
       <div *ngFor="let m of messages" 
            [class.sent]="m.sender === 'me'"
            style="display:flex; max-width: 70%;"
            [style.align-self]="m.sender === 'me' ? 'flex-end' : 'flex-start'">
          <div [style.background]="m.sender === 'me' ? 'var(--primary)' : 'var(--bg-main)'"
               [style.color]="m.sender === 'me' ? 'white' : 'var(--text-main)'"
               style="padding: 0.75rem 1rem; border-radius: 1rem; font-size: 0.875rem; box-shadow: var(--shadow-sm);">
            {{ m.content }}
          </div>
       </div>
    </div>

    <!-- Input Area -->
    <div style="padding: 1.5rem 2rem; border-top: 1px solid var(--border); display:flex; gap: 1rem; align-items:center;">
       <button class="icon-btn" style="border:none;"><i class="fas fa-paperclip"></i></button>
       <div class="search-bar" style="max-width:none; flex:1;">
          <input type="text" placeholder="Type a message..." style="padding-left: 1rem;" 
                 [(ngModel)]="newMessage" (keyup.enter)="sendMessage()">
       </div>
       <button class="btn btn-primary" style="padding: 0.5rem 1.5rem;" (click)="sendMessage()">
          <i class="fas fa-paper-plane"></i>
       </button>
    </div>
  </div>
</div>
