<div class="user-management-container">
  <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
    <div>
      <h1>User Management</h1>
      <p style="color: var(--text-muted);">Manage all system users and their roles.</p>
    </div>
    <button class="btn btn-primary" (click)="openAddUserModal()">
      <i class="fas fa-plus"></i> Add New User
    </button>
  </div>

  <!-- Filters -->
  <div class="card" style="margin-bottom: 1.5rem; padding: 1rem;">
    <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem;">
      <div class="search-bar" style="max-width: none;">
        <i class="fas fa-search search-icon"></i>
        <input type="text" placeholder="Search by name or email..." [(ngModel)]="searchTerm" (input)="filterUsers()">
      </div>
      <select class="input" [(ngModel)]="selectedRole" (change)="filterUsers()">
        <option value="">All Roles</option>
        <option value="ROLE_STUDENT">Student</option>
        <option value="ROLE_TEACHER">Teacher</option>
        <option value="ROLE_PARENT">Parent</option>
        <option value="ROLE_ADMIN">Admin</option>
      </select>
      <select class="input" [(ngModel)]="selectedStatus" (change)="filterUsers()">
        <option value="">All Status</option>
        <option value="ACTIVE">Active</option>
        <option value="LOCKED">Locked</option>
      </select>
    </div>
  </div>

  <!-- Table -->
  <div class="data-table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>User</th>
          <th>Role</th>
          <th>Organization</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of filteredUsers">
          <td>
            <div style="display:flex; align-items:center; gap: 0.75rem;">
              <div class="avatar" style="width: 32px; height: 32px;">
                <img [src]="'https://ui-avatars.com/api/?name=' + user.name + '&background=f1f5f9&color=6b7280'" alt="">
              </div>
              <div>
                <div style="font-weight:600;">{{ user.name }}</div>
                <div style="font-size:0.75rem; color: var(--text-muted);">{{ user.email }}</div>
              </div>
            </div>
          </td>
          <td>
            <span class="badge badge-indigo">{{ user.role | formatRole }}</span>
          </td>
          <td>{{ user.organizationName || 'N/A' }}</td>
          <td>
            <span class="badge" [ngClass]="user.status === 'ACTIVE' ? 'badge-success' : 'badge-error'">
              {{ user.status }}
            </span>
          </td>
          <td>
            <div style="display:flex; gap: 0.5rem;">
              <button class="icon-btn" style="width:32px; height:32px;" title="Edit">
                <i class="fas fa-edit" style="font-size:0.875rem;"></i>
              </button>
              <button class="icon-btn" style="width:32px; height:32px; color: var(--error);" title="Lock Account">
                <i class="fas fa-lock" style="font-size:0.875rem;"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <!-- Pagination -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 1.5rem;">
    <span style="font-size:0.875rem; color: var(--text-muted);">Showing 1 to 10 of 42 users</span>
    <div style="display:flex; gap: 0.5rem;">
       <button class="btn" style="background: white; border: 1px solid var(--border);">Previous</button>
       <button class="btn" style="background: white; border: 1px solid var(--border);">Next</button>
    </div>
  </div>
</div>

<!-- Add User Modal (Skeleton) -->
<div *ngIf="showModal" class="modal-overlay">
  <div class="card modal-content" style="max-width: 500px; width: 100%;">
    <div style="display:flex; justify-content:space-between; margin-bottom: 1.5rem;">
      <h3>Add New User</h3>
      <button (click)="closeModal()" style="border:none; background:none; cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <form (submit)="saveUser()">
      <div class="form-group">
        <label class="label">Full Name</label>
        <input type="text" class="input" placeholder="Enter full name">
      </div>
      <div class="form-group">
        <label class="label">Email Address</label>
        <input type="email" class="input" placeholder="name@example.com">
      </div>
      <div class="form-group">
        <label class="label">Role</label>
        <select class="input">
          <option value="ROLE_STUDENT">Student</option>
          <option value="ROLE_TEACHER">Teacher</option>
          <option value="ROLE_PARENT">Parent</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label">Password</label>
        <input type="password" class="input" placeholder="Create a password">
      </div>
      <div style="display:flex; gap: 1rem; margin-top: 2rem;">
        <button type="button" class="btn" style="flex:1; border: 1px solid var(--border);" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" style="flex:1;">Create User</button>
      </div>
    </form>
  </div>
</div>
