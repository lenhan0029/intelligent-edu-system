<div class="exam-session-wrapper" style="min-height: 100vh; background: #f1f5f9; padding: 2rem;">
  <div style="max-width: 900px; margin: 0 auto;">
    <!-- Top Bar -->
    <div class="card" style="margin-bottom: 2rem; padding: 1rem 2rem; display:flex; justify-content:space-between; align-items:center;">
       <div>
          <h2 style="font-size: 1.25rem;">Final Examination: Data Structures</h2>
          <span style="font-size:0.875rem; color: var(--text-muted);">Question 3 of 20</span>
       </div>
       <div style="display:flex; align-items:center; gap: 1.5rem;">
          <div style="text-align:right;">
             <div style="font-size:0.75rem; color: var(--text-muted); font-weight:600; text-transform:uppercase;">Time Remaining</div>
             <div style="font-size:1.5rem; font-weight:700; color: var(--error);">24:15</div>
          </div>
          <button class="btn btn-primary" style="background: var(--error);">Finish Exam</button>
       </div>
    </div>

    <!-- Question Area -->
    <div class="card" style="padding: 3rem; margin-bottom: 2rem;">
       <h2 style="margin-bottom: 2rem; line-height: 1.4;">What is the time complexity of searching for an element in a balanced Binary Search Tree (BST)?</h2>
       
       <div class="options-list" style="display:flex; flex-direction:column; gap: 1rem;">
          <label class="option-card" [class.selected]="selectedOption === 'A'">
             <input type="radio" name="exam-q" [(ngModel)]="selectedOption" value="A" style="display:none;">
             <div class="radio-circle"></div>
             <span>O(n)</span>
          </label>
          <label class="option-card" [class.selected]="selectedOption === 'B'">
             <input type="radio" name="exam-q" [(ngModel)]="selectedOption" value="B" style="display:none;">
             <div class="radio-circle"></div>
             <span>O(log n)</span>
          </label>
          <label class="option-card" [class.selected]="selectedOption === 'C'">
             <input type="radio" name="exam-q" [(ngModel)]="selectedOption" value="C" style="display:none;">
             <div class="radio-circle"></div>
             <span>O(1)</span>
          </label>
          <label class="option-card" [class.selected]="selectedOption === 'D'">
             <input type="radio" name="exam-q" [(ngModel)]="selectedOption" value="D" style="display:none;">
             <div class="radio-circle"></div>
             <span>O(n log n)</span>
          </label>
       </div>
    </div>

    <!-- Navigation -->
    <div style="display:flex; justify-content:space-between; align-items:center;">
       <button class="btn" style="background:white; border: 1px solid var(--border); padding: 0.75rem 2rem;">
          <i class="fas fa-chevron-left"></i> Previous
       </button>
       <div style="display:flex; gap: 0.5rem;">
          <div *ngFor="let i of [1,2,3,4,5,6,7]" 
               style="width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:600; cursor:pointer;"
               [style.background]="i === 3 ? 'var(--primary)' : 'white'"
               [style.color]="i === 3 ? 'white' : 'var(--text-main)'">
             {{i}}
          </div>
          <span style="color:var(--text-muted);">...</span>
       </div>
       <button class="btn btn-primary" style="padding: 0.75rem 2rem;">
          Next <i class="fas fa-chevron-right"></i>
       </button>
    </div>
  </div>
</div>
