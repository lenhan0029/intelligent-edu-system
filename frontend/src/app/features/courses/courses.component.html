<div class="courses-container">
  <div class="header">
    <h1>My Courses</h1>
    <p>View and manage your enrolled courses</p>
  </div>

  <div *ngIf="loading" class="loading-state">
    <div class="spinner"></div>
    <p>Loading courses...</p>
  </div>

  <div *ngIf="!loading && courses.length === 0" class="empty-state">
    <span class="icon">📚</span>
    <h3>No courses found</h3>
    <p>You are not enrolled in any courses yet.</p>
  </div>

  <div class="courses-grid" *ngIf="!loading && courses.length > 0">
    <div class="course-card" *ngFor="let course of courses">
      <div class="course-image">
        <img [src]="'https://ui-avatars.com/api/?name=' + course.name + '&background=random&color=fff&size=200'" alt="Course Thumbnail">
      </div>
      <div class="course-content">
        <h3 class="course-title">{{ course.name }}</h3>
        <p class="course-desc">{{ course.description || 'No description available' }}</p>
        <div class="course-meta">
          <span class="instructor">👤 Instructor Name</span>
          <span class="duration">⏱️ 12 Weeks</span>
        </div>
        <button class="view-btn">View Course</button>
      </div>
    </div>
  </div>
</div>
