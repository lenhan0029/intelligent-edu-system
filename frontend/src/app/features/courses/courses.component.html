<div class="courses-container">
  <div class="page-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 2rem;">
    <div>
      <h1>Course Catalog</h1>
      <p style="color: var(--text-muted);">Explore and manage courses in your organization.</p>
    </div>
    <div style="display:flex; gap: 1rem;">
      <div class="search-bar" style="width: 300px;">
        <i class="fas fa-search search-icon"></i>
        <input type="text" placeholder="Search courses...">
      </div>
      <button class="btn btn-primary">
        <i class="fas fa-plus"></i> Create Course
      </button>
    </div>
  </div>

  <div class="courses-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
    <!-- Course Card -->
    <div class="card course-card" *ngFor="let course of courses" style="padding:0; overflow:hidden; display:flex; flex-direction:column;">
      <div class="course-banner" style="height: 160px; background: var(--primary-light); position:relative;">
        <img [src]="course.thumbnail || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=800&auto=format&fit=crop'" 
             style="width:100%; height:100%; object-fit:cover;" alt="Course Thumb">
        <span class="badge" style="position:absolute; top:1rem; right:1rem; background: rgba(255,255,255,0.9); color: var(--primary);">
          {{ course.category || 'Education' }}
        </span>
      </div>
      
      <div class="course-content" style="padding: 1.5rem; flex: 1; display:flex; flex-direction:column;">
        <h3 style="margin-bottom: 0.5rem;">{{ course.name }}</h3>
        <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem; line-height:1.4;">
          {{ course.description | slice:0:100 }}...
        </p>
        
        <div style="margin-top: auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
            <div style="display:flex; align-items:center; gap: 0.5rem;">
              <div class="avatar" style="width:24px; height:24px;">
                 <img src="https://ui-avatars.com/api/?name=Teacher&background=random" alt="">
              </div>
              <span style="font-size:0.75rem; font-weight:500;">Prof. {{ course.teacherName || 'Unknown' }}</span>
            </div>
            <span style="font-size:0.875rem; font-weight:700; color: var(--primary);">${{ course.price || 0 }}</span>
          </div>
          
          <div style="display:flex; gap: 0.75rem;">
            <button class="btn" style="flex:1; border: 1px solid var(--border);" [routerLink]="['/courses', course.id]">Details</button>
            <button class="btn btn-primary" style="flex:1;">Enroll Now</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
