<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <div class="sidebar-header">
      <span class="logo-icon">🎓</span>
      <span class="logo-text" *ngIf="!isSidebarCollapsed">SmartEdu</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="icon">📊</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Dashboard</span>
      </a>
      <a routerLink="/courses" routerLinkActive="active" class="nav-item">
        <span class="icon">📚</span>
        <span class="label" *ngIf="!isSidebarCollapsed">My Courses</span>
      </a>
      <a routerLink="/exams" routerLinkActive="active" class="nav-item">
        <span class="icon">📝</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Exams</span>
      </a>
      <a routerLink="/schedule" routerLinkActive="active" class="nav-item">
        <span class="icon">📅</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Schedule</span>
      </a>
      
      <!-- Protected Routes -->
      <ng-container *ngIf="authService.hasRole('ROLE_FINANCE_MANAGER') || authService.hasRole('ROLE_ADMIN')">
        <a routerLink="/finance" routerLinkActive="active" class="nav-item">
          <span class="icon">💳</span>
          <span class="label" *ngIf="!isSidebarCollapsed">Finance</span>
        </a>
      </ng-container>

      <ng-container *ngIf="authService.hasRole('ROLE_ADMIN')">
        <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
          <span class="icon">👥</span>
          <span class="label" *ngIf="!isSidebarCollapsed">User Management</span>
        </a>
      </ng-container>
    </nav>

    <div class="sidebar-footer">
      <button (click)="logout()" class="nav-item logout-btn">
        <span class="icon">🚪</span>
        <span class="label" *ngIf="!isSidebarCollapsed">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-area">
    <!-- Navbar -->
    <header class="navbar">
      <div class="nav-left">
        <button (click)="toggleSidebar()" class="toggle-btn">
          <span class="icon">☰</span>
        </button>
        <div class="search-bar">
          <span class="search-icon">🔍</span>
          <input type="text" placeholder="Search for courses, materials...">
        </div>
      </div>

      <div class="nav-right">
        <button class="icon-btn">
          <span class="icon">🔔</span>
          <span class="badge">3</span>
        </button>
        <div class="user-profile">
          <div class="user-info">
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">{{ authService.getRoles()[0]?.replace('ROLE_', '') || 'Student' }}</span>
          </div>
          <div class="avatar">
            <img src="https://ui-avatars.com/api/?name={{userName}}&background=6366f1&color=fff" alt="User">
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
