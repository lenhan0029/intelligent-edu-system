<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
      <div class="logo-icon">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <span class="logo-text">EduSmart</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <i class="fas fa-th-large icon"></i>
        <span class="label">Dashboard</span>
      </a>

      <!-- Admin Specific -->
      <ng-container *ngIf="userRole === 'ROLE_ADMIN' || userRole === 'ROLE_SUPERADMIN'">
        <a routerLink="/users" routerLinkActive="active" class="nav-item">
          <i class="fas fa-users icon"></i>
          <span class="label">Users</span>
        </a>
        <a routerLink="/organizations" routerLinkActive="active" class="nav-item">
          <i class="fas fa-school icon"></i>
          <span class="label">Organizations</span>
        </a>
      </ng-container>

      <a routerLink="/courses" routerLinkActive="active" class="nav-item">
        <i class="fas fa-book icon"></i>
        <span class="label">Courses</span>
      </a>

      <a routerLink="/schedule" routerLinkActive="active" class="nav-item">
        <i class="fas fa-calendar-alt icon"></i>
        <span class="label">Schedule</span>
      </a>

      <a routerLink="/finance" routerLinkActive="active" class="nav-item">
        <i class="fas fa-wallet icon"></i>
        <span class="label">Finance</span>
      </a>

      <a routerLink="/chat" routerLinkActive="active" class="nav-item">
        <i class="fas fa-comment-dots icon"></i>
        <span class="label">Messages</span>
      </a>

      <div style="margin-top: auto;">
        <a (click)="logout()" class="nav-item" style="color: var(--error);">
          <i class="fas fa-sign-out-alt icon"></i>
          <span class="label">Logout</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <header class="navbar">
      <div class="nav-left">
        <button class="icon-btn" (click)="toggleSidebar()" style="border:none;">
          <i class="fas fa-bars"></i>
        </button>
        <div class="search-bar">
          <i class="fas fa-search search-icon"></i>
          <input type="text" placeholder="Search anything...">
        </div>
      </div>

      <div class="nav-right">
        <button class="icon-btn">
          <i class="fas fa-bell"></i>
          <span class="badge">3</span>
        </button>

        <div class="user-profile">
          <div class="user-info">
            <span class="user-name">{{ userName }}</span>
            <span class="user-role">{{ userRole | formatRole }}</span>
          </div>
          <div class="avatar">
            <img [src]="'https://ui-avatars.com/api/?name=' + userName + '&background=4f46e5&color=fff'" alt="User Avatar">
          </div>
        </div>
      </div>
    </header>

    <div class="page-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
