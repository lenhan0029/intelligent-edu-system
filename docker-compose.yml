      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - edu-network
    restart: unless-stopped

networks:
  edu-network:
    driver: bridge

volumes:
  postgres_data:
